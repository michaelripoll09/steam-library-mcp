schema: spec-driven

context: |
  Project: Steam Library MCP 2
  Stack: TypeScript ESM on Node.js LTS with Vitest, ESLint, and Prettier
  Architecture: Layered MCP adapters, services, Steam client, cache, and domain models
  Testing: Strict TDD with Vitest unit and contract coverage
  Persistence: Hybrid OpenSpec files plus Engram observations

strict_tdd: true

testing:
  test_runner: Vitest
  test_command: "npm test -- --run"
  unit: true
  integration: false
  e2e: false
  coverage: false
  linter: true
  type_checker: true
  formatter: true
  reason: "Vitest, TypeScript, ESLint, and Prettier were installed for strict TDD and quality gates."

rules:
  proposal:
    - Define scope and non-goals before implementation.
  specs:
    - Use Given/When/Then scenarios and RFC 2119 keywords where applicable.
  design:
    - Document architecture decisions and rationale.
  tasks:
    - Group tasks by phase and keep each task independently verifiable.
  apply:
    guidelines:
      - Follow conventions established by the implementation.
    tdd: true
    test_command: "npm test -- --run"
  verify:
    test_command: "npm test -- --run"
    build_command: "npm run typecheck && npm run lint && npm run format:check"
    coverage_threshold: 0
  archive:
    - Preserve archived changes as an audit trail.